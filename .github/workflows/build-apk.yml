
name: Gerar APK de teste

on:
  push:
    branches:
      - main
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair projeto
        run: |
          unzip -o AlertaEntrega-prototipo.zip -d .

      - name: Gerar APK
        run: gradle -p AlertaEntrega assembleDebug

      - name: Disponibilizar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlertaEntrega-APK
          path: AlertaEntrega/app/build/outputs/apk/debug/app-debug.apk
