

name: Gerar APK de teste

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Baixar código
        uses: actions/checkout@v4

      - name: Configurar Java
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Extrair e localizar projeto
        run: |
          unzip -o AlertaEntrega-prototipo.zip -d .
          echo "Arquivos na raiz:"
          ls -la
          test -f AlertaEntrega/settings.gradle.kts

      - name: Configurar Gradle 8.9
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.9'

      - name: Compilar APK
        run: gradle -p AlertaEntrega assembleDebug

      - name: Publicar APK
        uses: actions/upload-artifact@v4
        with:
          name: AlertaEntrega-APK
          path: AlertaEntrega/app/build/outputs/apk/debug/app-debug.apk
